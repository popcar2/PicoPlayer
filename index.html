<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TinyFun</title>
  <meta name="color-scheme" content="dark">
  <style>html { background: #000; visibility: hidden; } @view-transition { navigation: auto; }</style>
  <script src="js/fade.js"></script>
  <link rel="stylesheet" href="assets/style.css">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon.svg">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <meta name="theme-color" content="#000">
  <script src="js/offline.js"></script>
</head>
<body class="page">
  <a class="github" href="https://github.com/popcar2/TinyFun"><img src="assets/github.svg" alt="Source code on GitHub"></a>
  <main class="home">
    <h1>TinyFun</h1>
    <p>Welcome! This is a tiny, minimalist website to quickly play curated <a href="https://www.lexaloffle.com/pico-8.php">PICO-8</a> games.</p>
    <p class="hint-hover">Once you're in, hover the bottom of the screen to switch cartridges.</p>
    <p class="hint-touch">Once you're in, tap <i>Games</i> at the bottom of the screen to switch cartridges.</p>
    <!-- forget whether the info panel was left open, so it starts collapsed -->
    <a class="play" href="browse.html" onclick="try { localStorage.removeItem('info-open') } catch {}">Start Playing!</a>
  </main>
  <footer class="site-footer">Want to know more? See the <a href="about.html">about page</a>.</footer>
</body>
</html>
