<div class="info">
  <p>A puzzle platformer where you record your own movement and play it back, even in mid-air where there's nothing to stand on.</p>
  <br>
  <h2>Controls</h2>
  <dl>
    <dt>Arrows</dt><dd>Move</dd>
    <dt>Up + Z / C</dt><dd>Record your motion</dd>
    <dt>Z / C</dt><dd>Play it back</dd>
    <dt>Down + Z / C</dt><dd>Play it back in reverse</dd>
  </dl>
</div>
