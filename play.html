  <style data-src="assets/play.css">
/* the play page */

nav {
  display: flex;
  gap: 1.5rem;
  padding: .75rem 1rem;
}
nav a { text-decoration: none; white-space: nowrap; }
nav a:first-child { color: #fff1e8; font-weight: bold; }
/* game title: centred over the game on the nav's row, so it takes no height from the game.
   kept clear of the nav links on either side, and cut off rather than wrapping */
#meta {
  position: absolute;
  top: 0;
  left: calc(50% + 1.25rem);  /* the player starts 2.5rem in, after the info tab */
  transform: translateX(-50%);
  max-width: calc(100% - 20rem);
  padding: .75rem 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
nav a:last-child { margin-left: auto; }
#meta b { color: #fff1e8; }

.browse {
  display: flex;
  flex-direction: column;
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
}

.stage { position: relative; display: flex; flex: 1; min-height: 0; margin-bottom: .75rem; }
#player { flex: 1; min-width: 0; margin-left: 2.5rem; }  /* room for the closed info tab, which overlays it */
#player iframe { display: block; width: 100%; height: 100%; border: 0; }

/* loading spinner, covering the player while a game boots */
#player { position: relative; }
#loading { position: absolute; inset: 0; background: #000 url(assets/loading.svg) center no-repeat; pointer-events: none; }
#loading[hidden] { display: none; }

/* tucked below the screen with a thin strip showing; slides up when the cursor nears the bottom.
   the transparent top padding is the "near the bottom" band that triggers it */
.shelf {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 2;  /* above the info panel */
  padding-top: 3rem;
  transform: translateY(calc(100% - 3.75rem));
  transition: transform .2s ease-out;
}
.shelf:hover, .shelf:focus-within, .shelf.held { transform: none; }  /* held: the cursor left the window below it */

/* a tab on the shelf's top right edge, only there while the shelf is up */
#search {
  position: absolute;
  top: 3rem;  /* the top of the carousel, below the hover band */
  right: 3rem;
  z-index: -1;  /* behind the carousel and the Games bar, so its bottom edge never shows over them */
  width: min(12rem, 50vw);
  padding: .4rem .75rem;
  border: 0;
  border-radius: 3px 3px 0 0;
  background: #333;  /* same grey as the shelf */
  color: #fff1e8;
  font: inherit;
  font-size: 1rem;  /* any smaller and iOS zooms in on focus */
  outline: none;
  translate: 0 -100%;
  visibility: hidden;
}
#search::placeholder { color: #888; }
.shelf:hover #search, .shelf:focus-within #search, .shelf.held #search { visibility: visible; }

/* half-width side padding so even the first and last cartridge can sit in the middle */
.carousel {
  position: relative;
  display: flex;
  gap: 1rem;
  padding: 1rem calc(50% - 3.75rem);
  overflow-x: auto;
  scrollbar-width: thin;
  scrollbar-color: #5f574f #333;
  background: #333;
}

/* PC: a scrollbar 50% thicker than thin. firefox only has thin (8px) and auto (12px), so it gets auto; chromium
   and safari ignore the ::-webkit-scrollbar rules while scrollbar-width/color are set, so those are reset there */
@media (hover: hover) {
  .carousel { scrollbar-width: auto; }
  @supports selector(::-webkit-scrollbar) {
    .carousel { scrollbar-width: auto; scrollbar-color: auto; }
    .carousel::-webkit-scrollbar { height: 16px; background: #333; }
    .carousel::-webkit-scrollbar-thumb { background: #5f574f; }
  }
}

/* a cartridge: grey shell, clipped corner, thumbnail art, name, grip ridges. the shell is one svg laid out in
   percentages, with the corner and pins pinned to its edges, so it fits whatever height the thumbnail ends up */
.cart {
  flex: none;
  width: 7.5rem;
  padding: .5rem .5rem 1.4rem;
  border: 0;
  background: url(assets/"data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg'><mask id='m'><rect width='100%' height='100%' fill='white'/><svg x='100%' overflow='visible'><path d='M-12 0h12v12z'/></svg></mask><rect width='100%' height='100%' rx='3' fill='%235f574f' mask='url(%23m)'/><svg x='50%' y='100%' overflow='visible'><path stroke='%233a3a40' stroke-width='8' stroke-dasharray='4' d='M-34-10.4h68'/></svg></svg>");
  font: inherit;
  cursor: pointer;
  transition: transform .15s;
}
.cart .thumbnail {  /* its tile of the thumbnail sprite sheet, set in thumbnails.css */
  display: block;
  width: 100%;
  aspect-ratio: 1;
  image-rendering: pixelated;
  border: 3px solid #000;
  border-bottom: 0;
}
.cart span {
  display: block;
  padding: .2rem .25rem;
  background: #fff1e8;
  color: #000;
  font-size: .75rem;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  border: 3px solid #000;
  border-top: 0;
}
.cart:hover, .cart:focus-visible { transform: translateY(-4px); outline: none; }
.cart[aria-current] {
  background-image: url(assets/"data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg'><mask id='m'><rect width='100%' height='100%' fill='white'/><svg x='100%' overflow='visible'><path d='M-12 0h12v12z'/></svg></mask><rect width='100%' height='100%' rx='3' fill='%23ff004d' mask='url(%23m)'/><svg x='50%' y='100%' overflow='visible'><path stroke='%233a3a40' stroke-width='8' stroke-dasharray='4' d='M-34-10.4h68'/></svg></svg>");  /* same shell in red */
  transform: translateY(-4px);
}

/* info panel: just a sideways "Game Info" tab on the left until opened, then it widens to show the game's
   description and controls, with the tab sticking out past its right edge. it slides out over the
   player rather than pushing it aside, so the game stays put */
#meta .info { display: none; }
#info {
  position: absolute;
  top: 0;
  bottom: 0;
  left: 0;
  z-index: 1;  /* over the player */
  width: 2.5rem;
  border-right: 2px solid transparent;
  /* the grey snaps on when opening and only snaps off once it has slid shut, so it never fades */
  transition: width .2s ease-out, background-color 0s .2s, border-color 0s .2s;
}
#info.open {
  width: min(20rem, 80vw);
  background: #333;  /* same grey as the shelf */
  border-color: #333;
  transition: width .2s ease-out;
}
#info-toggle {
  position: absolute;
  top: 50%;
  right: .25rem;
  padding: 1rem 0;
  width: 2.25rem;  /* reaches the left edge of the closed panel */
  height: 8rem;  /* fixed, since the text's length would set it in vertical writing */
  border: 0;
  border-radius: 3px 0 0 3px;  /* flat on the left once rotated */
  background: #5f574f;
  color: #fff1e8;
  font: inherit;
  font-size: 1rem;  /* same as the PicoPlayer logo */
  font-weight: bold;
  white-space: nowrap;
  writing-mode: vertical-rl;
  transform: translateY(-50%) rotate(180deg);  /* reads bottom to top */
  cursor: pointer;
  transition: right .2s ease-out;
}
#info.open #info-toggle { right: calc(-2.25rem - 2px); }  /* just outside the panel and its border */
#info-toggle:hover, #info-toggle:focus-visible, #info.open #info-toggle { background: #ff004d; outline: none; }
#info-body {
  height: 100%;
  padding: 1rem 1rem 4.5rem;  /* clear the shelf's strip below */
  overflow: hidden auto;  /* clips the content while the panel widens */
  color: #bbb;
  font-size: .875rem;
  visibility: hidden;
  transition: visibility .2s;
}
#info.open #info-body { visibility: visible; }
#info-body > * { width: calc(min(20rem, 80vw) - 2rem); }  /* full width from the start, so text doesn't reflow mid-slide */
.byline { display: none; margin: 0 0 1rem; font-size: 1rem; }
.byline b { color: #fff1e8; }
.info p { margin: 0 0 1rem; }
.info h2 { margin: 0 0 .5rem; color: #fff; font-size: .875rem; text-transform: uppercase; }
/* descriptions copied from Lexaloffle posts bring their own headings, images, tables and code */
.info :is(h1, h3, h4, h5, h6) { margin: 0 0 .5rem; color: #fff; font-size: .875rem; }
.info :is(ul, ol) { margin: 0 0 1rem; padding-left: 1.25rem; }
.info img { display: block; max-width: 100%; height: auto; margin: 0 0 1rem; image-rendering: pixelated; }
.info :is(pre, table) { display: block; max-width: 100%; overflow-x: auto; margin: 0 0 1rem; }
.info a { color: #29adff; overflow-wrap: anywhere; }
.info hr { border: 0; border-top: 1px solid #555; margin: 0 0 1rem; }
.info .source { color: #888; font-size: .75rem; }
.info dl { display: grid; grid-template-columns: auto 1fr; gap: .25rem .75rem; margin: 0; }
.info dt { color: #fff; white-space: nowrap; }
.info dd { margin: 0; }

#shelf-toggle { display: none; }

/* touch screens can't hover, so the shelf becomes a sheet that pops up from a Games bar at the bottom,
   with the cartridges in a grid that scrolls vertically */
@media (hover: none) {
  #meta { display: none; }
  .stage { margin-bottom: 2rem; }  /* keep the game and its touch controls clear of the bar */
  .shelf, .shelf:hover, .shelf:focus-within {
    display: flex;
    flex-direction: column;
    height: 80dvh;
    padding-top: 0;
    transform: translateY(calc(100% - 2rem));
  }
  .shelf.open { transform: none; }
  #search, .shelf:hover #search, .shelf:focus-within #search { top: 0; right: auto; left: 50%; translate: -50% -100%; visibility: hidden; }
  .shelf.open #search { visibility: visible; }
  /* dims the page behind the open sheet, and taps on it close the sheet */
  .shelf.open::before { content: ""; position: fixed; inset: -100dvh 0 0; z-index: -1; background: rgb(0 0 0 / .6); }
  #shelf-toggle {
    display: block;
    flex: none;
    height: 2rem;
    border: 0;
    background: #5f574f;
    color: #fff1e8;
    font: inherit;
    font-weight: bold;
  }
  #shelf-toggle::before { content: "\25B2  "; }
  .shelf.open #shelf-toggle { background: #ff004d; }
  .shelf.open #shelf-toggle::before { content: "\25BC  "; }
  .carousel {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(7.5rem, 1fr));
    align-content: start;
    padding: 1rem;
    overflow: hidden auto;
  }
  .cart { width: auto; }
  .cart:hover { transform: none; }  /* a tap leaves :hover stuck on */
  .cart[aria-current] { transform: none; }
}

/* touch screens: Game Info moves to the top right of the bar in place of Random Game,
   and the game gets the full width now that the side tab is gone */
@media (hover: none) {
  #random { display: none; }
  #player { margin-left: 0; }
  #info { width: 0; }
  #info-toggle, #info-toggle:hover, #info-toggle:focus-visible, #info.open #info-toggle {
    position: fixed;
    top: 0;
    right: 0;
    width: auto;
    height: auto;
    padding: .75rem 1rem;
    border-radius: 0;
    background: none;
    color: #ff77a8;
    font-size: 1rem;
    font-weight: normal;
    writing-mode: horizontal-tb;
    transform: none;
  }
  #info.open #info-toggle { color: #fff1e8; }
  /* an invisible backdrop behind the open panel, over the game, so a tap anywhere else closes it.
     the shelf and its Games bar stay above it */
  #info.open::before { content: ""; position: fixed; inset: 0; z-index: -1; }
  .byline { display: block; }  /* the title bar is hidden, so name the game and its creator in the panel */
}

/* touch screens held sideways: the game is a square in the middle with empty space above the touch controls,
   so the nav floats over the top corners and the game takes its row too. only the links catch taps */
@media (hover: none) and (orientation: landscape) {
  nav { position: absolute; top: 0; left: 0; right: 0; z-index: 2; pointer-events: none; }  /* above the info panel */
  nav a { pointer-events: auto; }
  #info-body { padding-top: 3rem; }  /* clear the nav's row */
}

  <script>
  // a block, and listeners on document and window that go away on page:leave, since in Firefox js/transitions.js
  // swaps this page in and out without reloading, running this script again on each visit
  {
    let leaving = new AbortController(), signal = leaving.signal
    document.addEventListener("page:leave", () => leaving.abort(), { signal })

    let carousel = document.querySelector(".carousel")
    let shelf = document.querySelector(".shelf")
    let shelfToggle = document.querySelector("#shelf-toggle")
    let touch = matchMedia("(hover: none)")  // phones and tablets: the shelf is a pop-up sheet instead of a hover strip
    let target = 0, frame = 0
    let clamp = (x) => Math.max(0, Math.min(x, carousel.scrollWidth - carousel.clientWidth))

    // ease-in-out tween to a scroll position (ms = 0 jumps straight there)
    function slideTo(left, ms) {
      cancelAnimationFrame(frame)
      target = clamp(left)
      if (!ms) { carousel.scrollLeft = target; frame = 0; return }
      let from = carousel.scrollLeft, start = performance.now()
      let step = (now) => {
        let t = Math.min(1, (now - start) / ms)
        let ease = t < .5 ? 4 * t * t * t : 1 - (2 - 2 * t) ** 3 / 2
        carousel.scrollLeft = from + (target - from) * ease
        frame = t < 1 ? requestAnimationFrame(step) : 0
      }
      frame = requestAnimationFrame(step)
    }

    // glide after the wheel: keep moving a fraction of the remaining distance each frame
    function glideTo(left) {
      cancelAnimationFrame(frame)
      target = clamp(left)
      let step = () => {
        let gap = target - carousel.scrollLeft
        if (Math.abs(gap) < 1) { carousel.scrollLeft = target; frame = 0; return }
        carousel.scrollLeft += Math.sign(gap) * Math.max(1, Math.abs(gap) * .15)  // at least 1px or rounding stalls it
        frame = requestAnimationFrame(step)
      }
      frame = requestAnimationFrame(step)
    }

    // clicking a cartridge would focus it and make the browser jump it into view; we do the scrolling
    carousel.addEventListener("mousedown", (e) => { if (e.target.closest(".cart")) e.preventDefault() })
    // grabbing the scrollbar (a press on the carousel itself) takes over from any slide or glide still going
    carousel.addEventListener("mousedown", (e) => { if (e.target == carousel) { cancelAnimationFrame(frame); frame = 0 } })

    // mark the inserted cartridge and slide it to the middle of the shelf (instantly for the first pick on load)
    document.addEventListener("click", (e) => {
      let cart = e.target.closest(".cart")
      if (!cart) return
      if (search.value) filter("")
      let previous = document.querySelector(".cart[aria-current]")
      previous?.removeAttribute("aria-current")
      cart.setAttribute("aria-current", "true")
      history.replaceState(null, "", "#" + cart.getAttribute("fx-action").split("/")[1])  // shareable link to this game
      if (touch.matches) setShelfOpen(false)
      else slideTo(cart.offsetLeft - (carousel.clientWidth - cart.offsetWidth) / 2, previous ? 450 : 0)
    }, { signal })

    // on touch screens the Games bar opens the shelf as a sheet that scrolls vertically, starting at the current cartridge.
    // tapping the dimmed backdrop (the shelf's ::before) or picking a cartridge closes it
    function setShelfOpen(open) {
      shelf.classList.toggle("open", open)
      shelfToggle.setAttribute("aria-expanded", open)
      shelfToggle.textContent = open ? "Close" : "Games"
      let cart = document.querySelector(".cart[aria-current]")
      if (open && cart) carousel.scrollTop = cart.offsetTop - (carousel.clientHeight - cart.offsetHeight) / 2
    }
    shelfToggle.addEventListener("click", () => setShelfOpen(!shelf.classList.contains("open")))
    shelf.addEventListener("click", (e) => { if (e.target == shelf) setShelfOpen(false) })

    // the search box hides every cartridge whose name doesn't match as you type, and brings the first match into view.
    // Enter inserts the first match, Escape clears it, and picking a cartridge or closing the shelf clears it too. clearing it goes back to the loaded game
    let search = document.querySelector("#search")
    function filter(term) {
      search.value = term
      term = term.trim().toLowerCase()
      let carts = [...carousel.querySelectorAll(".cart")]
      for (let cart of carts) cart.hidden = !cart.textContent.toLowerCase().includes(term)
      let first = term ? carts.find((cart) => !cart.hidden) : carousel.querySelector(".cart[aria-current]")  // cleared: back to the loaded game
      if (!first) return
      if (touch.matches) carousel.scrollTop = term ? 0 : first.offsetTop - (carousel.clientHeight - first.offsetHeight) / 2
      else slideTo(first.offsetLeft - (carousel.clientWidth - first.offsetWidth) / 2, 0)
    }
    search.addEventListener("input", () => filter(search.value))
    search.addEventListener("keydown", (e) => {
      if (e.key == "Enter") carousel.querySelector(".cart:not([hidden])")?.click()
      else if (e.key == "Escape") filter("")
    })
    shelf.addEventListener("transitionend", (e) => {
      let closed = getComputedStyle(shelf).transform != "none"
      if (e.target == shelf && closed && search.value) filter("")
    })

    // Random Game inserts a different random cartridge instead of reloading the page
    document.querySelector("#random").addEventListener("click", (e) => {
      e.preventDefault()
      let carts = [...document.querySelectorAll(".cart:not([aria-current])")]
      carts[Math.floor(Math.random() * carts.length)].click()
    })

    // a plain mouse wheel scrolls the shelf sideways, continuing from wherever a slide still going was heading.
    // otherwise it starts from where the shelf is, which may not be the last target if the scrollbar was dragged
    carousel.addEventListener("wheel", (e) => {
      if (Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return
      e.preventDefault()
      glideTo((frame ? target : carousel.scrollLeft) + e.deltaY)
    }, { passive: false })

    // overshooting the scrollbar at the bottom of the screen takes the cursor out of the window, which would drop the
    // shelf's hover. so leaving the window from anywhere over the shelf holds it up until the cursor comes back in.
    // (not just from low on it: on a quick flick the last position the browser reports can still be up on the cartridges)
    shelf.addEventListener("mouseout", (e) => {
      if (!e.relatedTarget && !touch.matches) shelf.classList.add("held")
    })
    document.addEventListener("mouseover", () => shelf.classList.remove("held"), { signal })

    // no view transitions: they cover the page with a snapshot, freezing the slide and dropping the shelf's hover
    document.addEventListener("fx:config", (e) => e.detail.cfg.transition = false, { signal })

    // the info panel opens and closes from its tab, and remembers which way it was left
    let info = document.querySelector("#info")
    let toggle = document.querySelector("#info-toggle")
    function setInfoOpen(open) {
      info.classList.toggle("open", open)
      toggle.setAttribute("aria-expanded", open)
      try { localStorage.setItem("info-open", open) } catch {}
    }
    try { setInfoOpen(localStorage.getItem("info-open") == "true") } catch {}
    toggle.addEventListener("click", () => {
      setInfoOpen(!info.classList.contains("open"))
      document.querySelector("#screen").focus()  // keep the keys going to the game
    })
    // on touch screens, tapping outside the open panel (its ::before backdrop) closes it
    info.addEventListener("click", (e) => { if (e.target == info) setInfoOpen(false) })

    // once fixi swaps in the game's metadata, move its description and controls into the info panel
    // and boot its .p8.rom (plus any extra carts, listed after it in data-cart) in the shared player.
    // once the player is up it swaps carts in place (p8_load_cart) instead of reloading
    document.addEventListener("fx:swapped", () => {
      let meta = document.querySelector("#meta [data-cart]")
      let screen = document.querySelector("#screen")
      let details = document.querySelector("#meta .info")
      let byline = document.createElement("p")  // the title and creator, shown at the top of the panel on touch screens where #meta is hidden
      byline.className = "byline"
      byline.innerHTML = meta.innerHTML
      let body = document.querySelector("#info-body")
      body.replaceChildren(byline, ...(details ? [details] : []))
      body.scrollTop = 0  // start the new game's info from the top
      document.title = meta.dataset.title + " · PicoPlayer"
      window.countGame?.(meta.dataset.cart.split("/")[1], meta.dataset.title)  // js/stats.js, unless a blocker stopped it
      let carts = meta.dataset.cart.split(" ").map((cart) => "../" + cart)  // main cart first, then any extra carts it loads
      let banks = meta.dataset.banks && "../" + meta.dataset.banks  // data banks some games stream in (see pico8/player.html)
      let player = screen.contentWindow
      if (player.p8_load_cart && !screen.dataset.loading) showLoading(screen, player.p8_load_cart(carts, banks))
      else {
        screen.dataset.loading = true  // until the player page loads, swapping would reach the old one
        showLoading(screen, new Promise((resolve) => screen.addEventListener("load", () => {
          delete screen.dataset.loading
          resolve()
        }, { once: true })))
        player.location.replace("pico8/player.html?" + carts.map((cart) => "cart=" + cart).join("&") + (banks ? "&banks=" + banks : ""))
      }
      screen.focus()
    }, { signal })

    // the spinner covers the player from picking a game until the new game draws its first frame.
    // it waits for the new game to be booted first (or the player page to load), since until then pico8_state is still the old game's
    let loading = document.querySelector("#loading"), loads = 0
    function showLoading(screen, booted) {
      let load = ++loads  // a newer pick takes over, and its own wait hides the spinner
      loading.hidden = false
      booted.then(function check() {
        if (load != loads) return
        if (screen.contentWindow.pico8_state?.frame_number > 0) loading.hidden = true
        else requestAnimationFrame(check)
      })
    }

    // fixi wires up the buttons on DOMContentLoaded first, then we insert the linked cartridge (#<slug>) or a random one
    document.addEventListener("DOMContentLoaded", () => {
      let game = location.hash.slice(1)
      let carts = [...document.querySelectorAll(".cart")]
      let linked = carts.find((cart) => cart.getAttribute("fx-action") == `games/${game}/meta.html`)
      let cart = linked || carts[Math.floor(Math.random() * carts.length)]
      cart.click()
    }, { signal })

    // a game's link opened while already on this page only changes the hash, so insert that cartridge ourselves
    addEventListener("hashchange", () => {
      document.querySelector(`.cart[fx-action="games/${location.hash.slice(1)}/meta.html"]`)?.click()
    }, { signal })
  }
  </script>
