  <script>
  // a block, and listeners on document and window that go away on page:leave, since in Firefox js/transitions.js
  // swaps this page in and out without reloading, running this script again on each visit
  {
    let leaving = new AbortController(), signal = leaving.signal
    document.addEventListener("page:leave", () => leaving.abort(), { signal })

    let carousel = document.querySelector(".carousel")
    let shelf = document.querySelector(".shelf")
    let shelfToggle = document.querySelector("#shelf-toggle")
    let touch = matchMedia("(hover: none)")  // phones and tablets: the shelf is a pop-up sheet instead of a hover strip
    let target = 0, frame = 0
    let clamp = (x) => Math.max(0, Math.min(x, carousel.scrollWidth - carousel.clientWidth))

    // ease-in-out tween to a scroll position (ms = 0 jumps straight there)
    function slideTo(left, ms) {
      cancelAnimationFrame(frame)
      target = clamp(left)
      if (!ms) { carousel.scrollLeft = target; frame = 0; return }
      let from = carousel.scrollLeft, start = performance.now()
      let step = (now) => {
        let t = Math.min(1, (now - start) / ms)
        let ease = t < .5 ? 4 * t * t * t : 1 - (2 - 2 * t) ** 3 / 2
        carousel.scrollLeft = from + (target - from) * ease
        frame = t < 1 ? requestAnimationFrame(step) : 0
      }
      frame = requestAnimationFrame(step)
    }

    // glide after the wheel: keep moving a fraction of the remaining distance each frame
    function glideTo(left) {
      cancelAnimationFrame(frame)
      target = clamp(left)
      let step = () => {
        let gap = target - carousel.scrollLeft
        if (Math.abs(gap) < 1) { carousel.scrollLeft = target; frame = 0; return }
        carousel.scrollLeft += Math.sign(gap) * Math.max(1, Math.abs(gap) * .15)  // at least 1px or rounding stalls it
        frame = requestAnimationFrame(step)
      }
      frame = requestAnimationFrame(step)
    }

    // clicking a cartridge would focus it and make the browser jump it into view; we do the scrolling
    carousel.addEventListener("mousedown", (e) => { if (e.target.closest(".cart")) e.preventDefault() })
    // grabbing the scrollbar (a press on the carousel itself) takes over from any slide or glide still going
    carousel.addEventListener("mousedown", (e) => { if (e.target == carousel) { cancelAnimationFrame(frame); frame = 0 } })

    // mark the inserted cartridge and slide it to the middle of the shelf (instantly for the first pick on load)
    document.addEventListener("click", (e) => {
      let cart = e.target.closest(".cart")
      if (!cart) return
      if (search.value) filter("")
      let previous = document.querySelector(".cart[aria-current]")
      previous?.removeAttribute("aria-current")
      cart.setAttribute("aria-current", "true")
      history.replaceState(null, "", "#" + cart.getAttribute("fx-action").split("/")[1])  // shareable link to this game
      if (touch.matches) setShelfOpen(false)
      else slideTo(cart.offsetLeft - (carousel.clientWidth - cart.offsetWidth) / 2, previous ? 450 : 0)
    }, { signal })

    // on touch screens the Games bar opens the shelf as a sheet that scrolls vertically, starting at the current cartridge.
    // tapping the dimmed backdrop (the shelf's ::before) or picking a cartridge closes it
    function setShelfOpen(open) {
      shelf.classList.toggle("open", open)
      shelfToggle.setAttribute("aria-expanded", open)
      shelfToggle.textContent = open ? "Close" : "Games"
      let cart = document.querySelector(".cart[aria-current]")
      if (open && cart) carousel.scrollTop = cart.offsetTop - (carousel.clientHeight - cart.offsetHeight) / 2
    }
    shelfToggle.addEventListener("click", () => setShelfOpen(!shelf.classList.contains("open")))
    shelf.addEventListener("click", (e) => { if (e.target == shelf) setShelfOpen(false) })

    // the search box hides every cartridge whose name doesn't match as you type, and brings the first match into view.
    // Enter inserts the first match, Escape clears it, and picking a cartridge or closing the shelf clears it too. clearing it goes back to the loaded game
    let search = document.querySelector("#search")
    function filter(term) {
      search.value = term
      term = term.trim().toLowerCase()
      let carts = [...carousel.querySelectorAll(".cart")]
      for (let cart of carts) cart.hidden = !cart.textContent.toLowerCase().includes(term)
      let first = term ? carts.find((cart) => !cart.hidden) : carousel.querySelector(".cart[aria-current]")  // cleared: back to the loaded game
      if (!first) return
      if (touch.matches) carousel.scrollTop = term ? 0 : first.offsetTop - (carousel.clientHeight - first.offsetHeight) / 2
      else slideTo(first.offsetLeft - (carousel.clientWidth - first.offsetWidth) / 2, 0)
    }
    search.addEventListener("input", () => filter(search.value))
    search.addEventListener("keydown", (e) => {
      if (e.key == "Enter") carousel.querySelector(".cart:not([hidden])")?.click()
      else if (e.key == "Escape") filter("")
    })
    shelf.addEventListener("transitionend", (e) => {
      let closed = getComputedStyle(shelf).transform != "none"
      if (e.target == shelf && closed && search.value) filter("")
    })

    // Random Game inserts a different random cartridge instead of reloading the page
    document.querySelector("#random").addEventListener("click", (e) => {
      e.preventDefault()
      let carts = [...document.querySelectorAll(".cart:not([aria-current])")]
      carts[Math.floor(Math.random() * carts.length)].click()
    })

    // a plain mouse wheel scrolls the shelf sideways, continuing from wherever a slide still going was heading.
    // otherwise it starts from where the shelf is, which may not be the last target if the scrollbar was dragged
    carousel.addEventListener("wheel", (e) => {
      if (Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return
      e.preventDefault()
      glideTo((frame ? target : carousel.scrollLeft) + e.deltaY)
    }, { passive: false })

    // overshooting the scrollbar at the bottom of the screen takes the cursor out of the window, which would drop the
    // shelf's hover. so leaving the window from anywhere over the shelf holds it up until the cursor comes back in.
    // (not just from low on it: on a quick flick the last position the browser reports can still be up on the cartridges)
    shelf.addEventListener("mouseout", (e) => {
      if (!e.relatedTarget && !touch.matches) shelf.classList.add("held")
    })
    document.addEventListener("mouseover", () => shelf.classList.remove("held"), { signal })

    // no view transitions: they cover the page with a snapshot, freezing the slide and dropping the shelf's hover
    document.addEventListener("fx:config", (e) => e.detail.cfg.transition = false, { signal })

    // the info panel opens and closes from its tab, and remembers which way it was left
    let info = document.querySelector("#info")
    let toggle = document.querySelector("#info-toggle")
    function setInfoOpen(open) {
      info.classList.toggle("open", open)
      toggle.setAttribute("aria-expanded", open)
      try { localStorage.setItem("info-open", open) } catch {}
    }
    try { setInfoOpen(localStorage.getItem("info-open") == "true") } catch {}
    toggle.addEventListener("click", () => {
      setInfoOpen(!info.classList.contains("open"))
      document.querySelector("#screen").focus()  // keep the keys going to the game
    })
    // on touch screens, tapping outside the open panel (its ::before backdrop) closes it
    info.addEventListener("click", (e) => { if (e.target == info) setInfoOpen(false) })

    // once fixi swaps in the game's metadata, move its description and controls into the info panel
    // and boot its .p8.rom (plus any extra carts, listed after it in data-cart) in the shared player.
    // once the player is up it swaps carts in place (p8_load_cart) instead of reloading
    document.addEventListener("fx:swapped", () => {
      let meta = document.querySelector("#meta [data-cart]")
      let screen = document.querySelector("#screen")
      let details = document.querySelector("#meta .info")
      let byline = document.createElement("p")  // the title and creator, shown at the top of the panel on touch screens where #meta is hidden
      byline.className = "byline"
      byline.innerHTML = meta.innerHTML
      let body = document.querySelector("#info-body")
      body.replaceChildren(byline, ...(details ? [details] : []))
      body.scrollTop = 0  // start the new game's info from the top
      document.title = meta.dataset.title + " · PicoPlayer"
      window.countGame?.(meta.dataset.cart.split("/")[1], meta.dataset.title)  // js/stats.js, unless a blocker stopped it
      let carts = meta.dataset.cart.split(" ").map((cart) => "../" + cart)  // main cart first, then any extra carts it loads
      let banks = meta.dataset.banks && "../" + meta.dataset.banks  // data banks some games stream in (see pico8/player.html)
      let player = screen.contentWindow
      if (player.p8_load_cart && !screen.dataset.loading) showLoading(screen, player.p8_load_cart(carts, banks))
      else {
        screen.dataset.loading = true  // until the player page loads, swapping would reach the old one
        showLoading(screen, new Promise((resolve) => screen.addEventListener("load", () => {
          delete screen.dataset.loading
          resolve()
        }, { once: true })))
        player.location.replace("pico8/player.html?" + carts.map((cart) => "cart=" + cart).join("&") + (banks ? "&banks=" + banks : ""))
      }
      screen.focus()
    }, { signal })

    // the spinner covers the player from picking a game until the new game draws its first frame.
    // it waits for the new game to be booted first (or the player page to load), since until then pico8_state is still the old game's
    let loading = document.querySelector("#loading"), loads = 0
    function showLoading(screen, booted) {
      let load = ++loads  // a newer pick takes over, and its own wait hides the spinner
      loading.hidden = false
      booted.then(function check() {
        if (load != loads) return
        if (screen.contentWindow.pico8_state?.frame_number > 0) loading.hidden = true
        else requestAnimationFrame(check)
      })
    }

    // fixi wires up the buttons on DOMContentLoaded first, then we insert the linked cartridge (#<slug>) or a random one
    document.addEventListener("DOMContentLoaded", () => {
      let game = location.hash.slice(1)
      let carts = [...document.querySelectorAll(".cart")]
      let linked = carts.find((cart) => cart.getAttribute("fx-action") == `games/${game}/meta.html`)
      let cart = linked || carts[Math.floor(Math.random() * carts.length)]
      cart.click()
    }, { signal })

    // a game's link opened while already on this page only changes the hash, so insert that cartridge ourselves
    addEventListener("hashchange", () => {
      document.querySelector(`.cart[fx-action="games/${location.hash.slice(1)}/meta.html"]`)?.click()
    }, { signal })
  }
  </script>
